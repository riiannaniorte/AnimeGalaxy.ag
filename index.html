<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaiAnime - Inicio</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/png" href="DaiAnime.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="page-header">
    <h1>
        <a href="index.html">
            <img src="DaiAnime.jpeg" alt="Logo" style="height:40px; vertical-align:middle;">
            DaiAnime
        </a>
    </h1>
    <nav class="main-menu">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="Buscar.html">Buscar</a></li> 
            <li><a href="admin.html" id="menu-admin">Admin</a></li>
            <li class="user-menu-item">
                <a href="#" id="nombre-usuario">Usuario</a>
                <ul class="user-dropdown">
                <li><a href="Mi_lista.html">Mi Lista</a></li>
                <li><a href="favoritos.html">Animes Favoritos</a></li>
                <li class="logout-separator"><a href="iniciar_sesion.html" onclick="localStorage.removeItem('usuario_conectado');">Cerrar Sesión</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

<h2 class="h3">Animes/Temporadas Nuevas 2026</h2>
<section class="anime-list" id="contenedor-2026">
    <!-- Los animes de 2026 se cargarán aquí automáticamente -->
</section>

<h2 class="h3">Animes 2025</h2>
<section class="anime-list" id="contenedor-2025">
    <!-- Los animes de 2025 se cargarán aquí automáticamente -->
</section>

<footer>
    <p>© 2026 DaiAnime. Todos los derechos reservados.</p>
    <div class="social-links">  
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
    </div>
</footer>

<script>
    window.addEventListener('DOMContentLoaded', function() {
        const usuarioActual = localStorage.getItem('usuario_conectado');
        const menuAdmin = document.getElementById('menu-admin');
        const nombreUsuarioLink = document.getElementById('nombre-usuario');

        // Si hay un usuario conectado, cambiamos el texto "Usuario" por su nombre
        if (usuarioActual && nombreUsuarioLink) {
            nombreUsuarioLink.textContent = usuarioActual;
        }

        // Ocultar o mostrar el botón de Admin según el rol
        if (menuAdmin) {
            if (usuarioActual !== 'admin') {
                menuAdmin.style.display = 'none';
            }
        }

        // Cargar animes de la base de datos de SheetDB
        cargarAnimesInicio();
    });

    const sheetDbAnimesUrl = 'https://sheetdb.io/api/v1/2fm1f2txx7vmc';

    function cargarAnimesInicio() {
        fetch(sheetDbAnimesUrl)
            .then(res => res.json())
            .then(animes => {
                const contenedor2026 = document.getElementById('contenedor-2026');
                const contenedor2025 = document.getElementById('contenedor-2025');

                contenedor2026.innerHTML = '';
                contenedor2025.innerHTML = '';

                let hay2026 = false;
                let hay2025 = false;

                animes.forEach(anime => {
                    if (!anime.titulo || !anime.fecha) return;

                    const anioEstreno = anime.fecha.substring(0, 4);
                    const rutaImagen = anime.imagen ? anime.imagen : 'imagenes/anime/default.jpg';
                    const linkDetalle = `anime.html?titulo=${encodeURIComponent(anime.titulo)}`;

                    const tarjetaHTML = `
                        <div class="anime-card news-card">
                            <a href="${linkDetalle}">
                                <img src="${rutaImagen}" class="anime-img" alt="${anime.titulo}" onerror="this.src='imagenes/anime/default.jpg';">
                            </a>
                            <h3 class="anime-title">${anime.titulo}</h3>
                            <p class="anime-genre">Estreno: ${anime.fecha}</p>
                        </div>
                    `;

                    if (anioEstreno === '2026') {
                        contenedor2026.innerHTML += tarjetaHTML;
                        hay2026 = true;
                    } else if (anioEstreno === '2025') {
                        contenedor2025.innerHTML += tarjetaHTML;
                        hay2025 = true;
                    }
                });

                if (!hay2026) {
                    contenedor2026.innerHTML = '<p style="color: white; padding: 10px;">No hay animes registrados para 2026.</p>';
                }
                if (!hay2025) {
                    contenedor2025.innerHTML = '<p style="color: white; padding: 10px;">No hay animes registrados para 2025.</p>';
                }
            })
            .catch(err => console.error('Error al cargar los animes de inicio:', err));
    }
</script>
</body>
</html>
