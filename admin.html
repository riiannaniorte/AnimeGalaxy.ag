<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="icon" type="image/png" href="DaiAnime.jpeg">
    <script>
        const usuarioActual = localStorage.getItem('usuario_conectado');
        if (usuarioActual !== 'admin') {
            alert('Acceso denegado. Solo para administradores.');
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>

<header class="page-header">
    <h1>
        <a href="index.html">
            <img src="DaiAnime.jpeg" alt="Logo" style="height:40px; vertical-align:middle;">
            DaiAnime
        </a>
    </h1>
    <nav class="main-menu">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="Buscar.html">Buscar</a></li> 
            <li class="user-menu-item">
                <a href="#" class="user-link" id="nombre-usuario">Usuario</a>
                <ul class="user-dropdown">
                    <li><a href="Mi_lista.html">Mi Lista</a></li>
                    <li><a href="favoritos.html">Favoritos</a></li>
                    <li class="logout-separator"><a href="iniciar_sesion.html" onclick="localStorage.removeItem('usuario_conectado');">Cerrar Sesión</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

<div class="container">
    <h1>Panel de Administración</h1>

    <h2 style="margin-top:20px;">Añadir Nuevo Contenido</h2>
    <form>
        <label>Título</label>
        <input type="text" name="titulo" required>
        
        <label>Fecha / Año de Estreno (Ej: 2026-03-19 o solo 2026)</label>
        <input type="text" name="fecha" placeholder="2026" required>

        <label>URL de la Imagen de Portada</label>
        <input type="url" name="imagen" placeholder="https://ejemplo.com/imagen.jpg" required>

        <label>Categoría</label>
        <select name="categoria" required>
            <option value="anime">Anime</option>
            <option value="serie">Serie</option>
            <option value="pelicula">Película</option>
        </select>

        <label>Géneros (Sepáralos con comas, ej: Acción, Comedia, Drama)</label>
        <input type="text" name="genero" placeholder="Acción, Aventura, Fantasía" required>
        
        <label>Sinopsis</label>
        <textarea name="sinopsis" rows="4" required></textarea>

        <label>Link de Visualización / Reproducción</label>
        <input type="url" name="link" placeholder="https://..." required>

        <button type="submit">Guardar en Base de Datos</button>
    </form>

    <h2 style="margin-top:40px;">Lista de Contenidos</h2>
    <table id="tabla-animes">
        <tr>
            <th>Título</th>
            <th>Categoría</th>
            <th>Géneros</th>
            <th>Año/Fecha</th>
            <th>Acción</th>
        </tr>
    </table>
</div>

<script>
    const sheetDbUsuariosUrl = 'https://sheetdb.io/api/v1/z5xz8q7sh8ad3';
    const sheetDbAnimesUrl = 'https://sheetdb.io/api/v1/2fm1f2txx7vmc';
    
    const formAnime = document.querySelector('form');

    document.addEventListener('DOMContentLoaded', function() {
        const usuarioActualStorage = localStorage.getItem('usuario_conectado');
        const nombreUsuarioLink = document.getElementById('nombre-usuario');
        if (usuarioActualStorage && nombreUsuarioLink) {
            nombreUsuarioLink.textContent = usuarioActualStorage;
        }

        fetch(sheetDbAnimesUrl)
            .then(res => res.json())
            .then(animes => {
                const tablaListaAnimes = document.getElementById('tabla-animes');
                if (!tablaListaAnimes) return;

                tablaListaAnimes.innerHTML = `
                    <tr>
                        <th>Título</th>
                        <th>Categoría</th>
                        <th>Géneros</th>
                        <th>Año/Fecha</th>
                        <th>Acción</th>
                    </tr>
                `;

                animes.forEach(anime => {
                    if (anime.titulo) {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `
                            <td>${anime.titulo}</td>
                            <td>${anime.categoria || 'N/D'}</td>
                            <td>${anime.genero || 'N/D'}</td>
                            <td>${anime.fecha || 'N/D'}</td>
                            <td>
                                <a href="#" style="color:#e74c3c;" onclick="borrarAnime('${anime.titulo}')">Borrar</a>
                            </td>
                        `;
                        tablaListaAnimes.appendChild(fila);
                    }
                });
            })
            .catch(err => console.error('Error al cargar la lista:', err));
    });

    formAnime.addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = new FormData(formAnime);
        const nuevoContenido = {
            titulo: formData.get('titulo'),
            fecha: formData.get('fecha'),
            imagen: formData.get('imagen'),
            categoria: formData.get('categoria'),
            genero: formData.get('genero'),
            sinopsis: formData.get('sinopsis'),
            link: formData.get('link')
        };

        fetch(sheetDbAnimesUrl, {
            method: 'POST',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ data: [nuevoContenido] })
        })
        .then(res => res.json())
        .then(() => {
            alert('¡Contenido añadido correctamente con sus géneros y fecha!');
            formAnime.reset();
            location.reload();
        })
        .catch(error => {
            console.error('Error al guardar:', error);
            alert('Hubo un error al guardar el contenido.');
        });
    });

    function borrarAnime(tituloAnime) {
        if (!confirm(`¿Estás seguro de borrar "${tituloAnime}"?`)) return;

        fetch(`${sheetDbAnimesUrl}/titulo/${encodeURIComponent(tituloAnime)}`, {
            method: 'DELETE',
            headers: { 'Accept': 'application/json' }
        })
        .then(res => res.json())
        .then(() => {
            alert('Contenido borrado correctamente.');
            location.reload();
        })
        .catch(err => {
            console.error('Error al borrar:', err);
            alert('No se pudo borrar el contenido.');
        });
    }
</script>
</body>
</html>
