<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - AnimeGalaxy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="icon" href="https://drive.google.com/uc?export=view&id=1snA7nhE3vNeix-iXoUGH_sU7Yg531aAy">
  <link rel="stylesheet" href="styless.css"> <!-- Usa el mismo CSS del index -->
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="navbar-brand">
      <img src="https://drive.google.com/uc?export=view&id=1snA7nhE3vNeix-iXoUGH_sU7Yg531aAy" alt="AnimeGalaxy Logo" class="navbar-logo">
      <span>AnimeGalaxy</span>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>

    <div class="navbar-menu">
      <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
      <a href="buscar_anime.html"><i class="fas fa-film"></i> Directorio Anime</a>
      <a href="visto.html"><i class="fas fa-check"></i> Animes Vistos</a>
      <a href="pre-registro.html"><i class="fas fa-edit"></i> Pre-registro</a>
      <a href="foro.html"><i class="fas fa-comments"></i> Foro</a>
      <a href="quienes_somos.html"><i class="fas fa-users"></i> Quiénes Somos</a>
      <a href="contacto.html"><i class="fas fa-envelope"></i> Contacto</a>
    </div>
  </div>

  <!-- Contenedor principal -->
  <div class="container" style="text-align:center; max-width:600px; margin:50px auto; background:rgba(255,255,255,0.1); padding:30px; border-radius:10px;">
    <h1 style="color:var(--secondary-color); margin-bottom:20px;">Registro</h1>
    <form action="index.html" method="POST" style="display:flex; flex-direction:column; align-items:center;">
      <input type="text" id="register-username" name="register-username" placeholder="Usuario" required>
      <input type="email" id="register-email" name="register-email" placeholder="Correo Electrónico" required>
      <input type="password" id="register-password" name="register-password" placeholder="Contraseña" required>
      <button type="submit" class="explore-button">Registrarse</button>
    </form>
  </div>

  <footer>
    <p>© 2025 AnimeGalaxy. Todos los derechos reservados.</p>
    <div class="social-links">
      <a href="#"><i class="fab fa-facebook"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-youtube"></i></a>
    </div>
  </footer>

  <!-- Botón volver arriba -->
  <div class="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
    <i class="fas fa-arrow-up"></i>
  </div>

  <!-- Script del menú hamburguesa -->
  <script>
    function toggleMenu() {
      const menu = document.querySelector('.navbar-menu');
      const toggle = document.querySelector('.menu-toggle');
      menu.classList.toggle('active');
      toggle.classList.toggle('active');
    }

    document.querySelectorAll('.navbar-menu a').forEach(link => {
      link.addEventListener('click', () => {
        const menu = document.querySelector('.navbar-menu');
        const toggle = document.querySelector('.menu-toggle');
        if (menu.classList.contains('active')) {
          menu.classList.remove('active');
          toggle.classList.remove('active');
        }
      });
    });
  </script>
</body>
</html>
