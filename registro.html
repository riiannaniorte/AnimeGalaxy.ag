<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DaiAnime - Registro</title>
    <link rel="icon" type="image/png" href="DaiAnime.jpeg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: url('anime2.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #1c1b1b;
            width: 350px;
            padding: 30px;
            border: 1px solid #333;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        .logo img {
            max-width: 150px;
        }
        
        input {
            width: 100%;
            padding: 10px 0;
            margin-bottom: 20px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: white;
            outline: none;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 10px;
            border: 1px solid red;
            background: transparent;
            color: red;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
        }
        
        .btn-red {
            background: red;
            color: white;
            border: 1px solid red;
        }
        
        .terms {
            color: #666;
            font-size: 11px;
            text-align: center;
            margin: 20px 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo"><img src="DaiAnime.jpeg" alt="DaiAnime"></div>
    <form>
        <div style="color: white;">Correo electrónico</div>
        <input type="email" name="email" required>
        <div style="color: white;">Nombre de usuario</div>
        <input type="text" name="user" required>
        <div style="color: white;">Contraseña</div>
        <input type="password" name="pass" required>
        <div style="color: white;">Vuelve a escribir la contraseña</div>
        <input type="password" name="pass2" required>
        <div class="terms">Al registrarte aceptas los términos y políticas de DaiAnime</div>
        <div class="buttons">
            <button type="button" onclick="window.location.href='iniciar_sesion.html'">Volver</button>
            <button type="submit" class="btn-red">Registrarme</button>
        </div>
    </form>
</div>
<!-- Iframe oculto para evitar que la página se quede en blanco al enviar -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(isSubmitted){window.location.href='iniciar_sesion.html';}"></iframe>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwGn0qspMmvRKn7uoBd6nCzcgSHYKW6Evrlrr_4YnPu5ehXccoO0TTNWm8vwfR-2Mpx/exec';
    const form = document.querySelector('form');
    let isSubmitted = false;

    // Configuramos el formulario para que apunte a Google y use el iframe oculto
    form.action = scriptURL;
    form.method = 'POST';
    form.target = 'hidden_iframe';

    form.addEventListener('submit', function() {
        isSubmitted = true;
        // Opcional: puedes mostrar un aviso de carga si quieres
    });
</script>
</body>
</html>
