<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DaiAnime - Registro</title>
    <link rel="icon" type="image/png" href="DaiAnime.jpeg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: url('anime2.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #1c1b1b;
            width: 350px;
            padding: 30px;
            border: 1px solid #333;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        .logo img {
            max-width: 150px;
        }
        
        input {
            width: 100%;
            padding: 10px 0;
            margin-bottom: 20px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: white;
            outline: none;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 10px;
            border: 1px solid red;
            background: transparent;
            color: red;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
        }
        
        .btn-red {
            background: red;
            color: white;
            border: 1px solid red;
        }
        
        .terms {
            color: #666;
            font-size: 11px;
            text-align: center;
            margin: 20px 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo"><img src="DaiAnime.jpeg" alt="DaiAnime"></div>
    <form>
        <div style="color: white;">Correo electrónico</div>
        <input type="email" name="email" required>
        <div style="color: white;">Nombre de usuario</div>
        <input type="text" name="user" required>
        <div style="color: white;">Contraseña</div>
        <input type="password" name="pass" required>
        <div style="color: white;">Vuelve a escribir la contraseña</div>
        <input type="password" name="pass2" required>
        <div class="terms">Al registrarte aceptas los términos y políticas de DaiAnime</div>
        <div class="buttons">
            <button type="button" onclick="window.location.href='iniciar_sesion.html'">Volver</button>
            <button type="submit" class="btn-red">Registrarme</button>
        </div>
    </form>
</div>
<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyWK6uiL5cICQb2eAJF_CBb33l6W2jwpJWvmvL_vhzr2oHOU3TGYOVxM-tCbhZL2zcU/exec';
    const form = document.querySelector('form');

    form.addEventListener('submit', function(e) {
        e.preventDefault(); // Evitamos que recargue la página instantáneamente

        // Creamos los datos en formato de formulario clásico (evita bloqueos de CORS)
        const formData = new URLSearchParams();
        formData.append('email', form.querySelector('input[name="email"]').value);
        formData.append('user', form.querySelector('input[name="user"]').value);
        formData.append('pass', form.querySelector('input[name="pass"]').value);

        // Enviamos la petición
        fetch(scriptURL, {
            method: 'POST',
            body: formData
        })
        .then(response => {
            alert('¡Registrado y guardado en tu Excel de Google Drive con éxito!');
            window.location.href = 'iniciar_sesion.html';
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert('Hubo un error al registrar.');
        });
    });
</script>
</body>
</html>
