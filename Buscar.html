<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Animes - DaiAnime</title>
    <link rel="stylesheet" href="Buscar.css">
    <link rel="icon" type="image/png" href="DaiAnime.jpeg">
</head>
<body>

<header class="page-header">
    <h1>
        <a href="index.html">
            <img src="DaiAnime.jpeg" alt="Logo" style="height:40px; vertical-align:middle;">
            DaiAnime
        </a>
    </h1>

     <nav class="main-menu">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="Buscar.html">Buscar</a></li> 
            <li><a href="admin.html" id="menu-admin">Admin</a></li>
            <li class="user-menu-item">
                <a href="#" id="nombre-usuario">Usuario</a>
                <ul class="user-dropdown">
                <li><a href="Mi_lista.html">Mi Lista</a></li>
                <li><a href="favoritos.html">Animes Favoritos</a></li>
                <li class="logout-separator"><a href="iniciar_sesion.html" onclick="localStorage.removeItem('usuario_conectado');">Cerrar Sesión</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

<form method="GET" class="search-filters-form" onsubmit="return false;">
    <input type="text" name="buscar" id="searchInput" placeholder="Buscar anime...">
    
    <select name="tipo" id="filtroTipo">
        <option value="Todos">Tipo: Todos</option>
        <option value="TV">TV</option>
        <option value="Movie">Movie</option>
        <option value="OVA">OVA</option>
        <option value="ONA">ONA</option>
    </select>

    <select name="estado" id="filtroEstado">
        <option value="Todos">Estado: Todos</option>
        <option value="En emisión">En emisión</option>
        <option value="Finalizado">Finalizado</option>
    </select>

    <button type="button" id="btnFiltrar">FILTRAR</button>
</form>

<!-- Contenedor donde se cargarán dinámicamente los animes de SheetDB -->
<div class="anime-grid" id="contenedor-animes">
    <!-- Los animes se cargarán aquí automáticamente desde el Excel -->
</div>

<footer>
    <p>© 2026 DaiAnime. Todos los derechos reservados.</p>
</footer>

<script>
    // Control de sesión y menú de usuario
    window.addEventListener('DOMContentLoaded', function() {
        const usuarioActual = localStorage.getItem('usuario_conectado');
        const menuAdmin = document.getElementById('menu-admin');
        const nombreUsuarioLink = document.getElementById('nombre-usuario');

        if (usuarioActual && nombreUsuarioLink) {
            nombreUsuarioLink.textContent = usuarioActual;
        }

        if (menuAdmin) {
            if (usuarioActual !== 'admin') {
                menuAdmin.style.display = 'none';
            }
        }
    });

    // Conexión con SheetDB para cargar y filtrar los animes
    const sheetDbAnimesUrl = 'https://sheetdb.io/api/v1/2fm1f2txx7vmc';
    const inputBuscar = document.getElementById('searchInput');
    const contenedorAnimes = document.getElementById('contenedor-animes');
    const filtroTipo = document.getElementById('filtroTipo');
    const filtroEstado = document.getElementById('filtroEstado');

    let todosLosAnimes = [];

    // Cargar animes al iniciar la página
    fetch(sheetDbAnimesUrl)
        .then(res => res.json())
        .then(data => {
            todosLosAnimes = data;
            mostrarAnimes(todosLosAnimes);
        })
        .catch(err => console.error('Error al cargar animes:', err));

    // Función para pintar las tarjetas en la pantalla con su respectiva URL de imagen
    function mostrarAnimes(animes) {
        if (!contenedorAnimes) return;
        contenedorAnimes.innerHTML = '';

        if (animes.length === 0) {
            contenedorAnimes.innerHTML = '<p style="color: white; text-align: center; grid-column: 1 / -1;">No se encontraron animes.</p>';
            return;
        }

        animes.forEach(anime => {
            if (!anime.titulo) return;

            const card = document.createElement('div');
            card.className = 'anime-card';
            
            const anio = anime.fecha ? anime.fecha.substring(0, 4) : 'N/D';
            
            // Usamos directamente la URL de la imagen pegada en el admin (o una por defecto si está vacía)
            const rutaImagen = anime.imagen ? anime.imagen : 'imagenes/anime/default.jpg';
            
            // Serializamos el objeto anime de forma segura para pasarlo por parámetro en los botones
            const animeJson = JSON.stringify(anime).replace(/"/g, '&quot;');

            card.innerHTML = `
                <a href="anime.html">
                    <img src="${rutaImagen}" alt="${anime.titulo}" onerror="this.src='imagenes/anime/default.jpg';">
                </a>
                <div class="anime-details">
                    <h4>${anime.titulo}</h4>
                    <p><strong>Año:</strong> ${anio}</p>
                    <p><strong>Tipo:</strong> ${anime.tipo || 'N/D'}</p>
                    <p class="sinopsis-corta"><strong>Sinopsis:</strong> ${anime.sinopsis || 'Sin sinopsis.'}</p>
                    
                    <div class="botones">
                        <button type="button" class="save-button" onclick='guardarEnLista(${animeJson})'>Guardar Anime</button>
                        <button type="button" class="favorite-button" onclick='guardarEnFavoritos(${animeJson})'>⭐</button>
                    </div>
                </div>
            `;
            contenedorAnimes.appendChild(card);
        });
    }

    // Funciones para guardar el anime completo en Mi Lista o Favoritos (LocalStorage)
    function guardarEnLista(animeObj) {
        let miLista = JSON.parse(localStorage.getItem('mi_lista_anime')) || [];
        if (!miLista.some(a => a.titulo === animeObj.titulo)) {
            miLista.push(animeObj);
            localStorage.setItem('mi_lista_anime', JSON.stringify(miLista));
            alert(`¡"${animeObj.titulo}" se ha añadido a tu Lista!`);
        } else {
            alert(`"${animeObj.titulo}" ya está en tu Lista.`);
        }
    }

    function guardarEnFavoritos(animeObj) {
        let favoritos = JSON.parse(localStorage.getItem('favoritos_anime')) || [];
        if (!favoritos.some(a => a.titulo === animeObj.titulo)) {
            favoritos.push(animeObj);
            localStorage.setItem('favoritos_anime', JSON.stringify(favoritos));
            alert(`⭐ ¡"${animeObj.titulo}" se ha añadido a Favoritos!`);
        } else {
            alert(`"${animeObj.titulo}" ya está en tus Favoritos.`);
        }
    }

    // Filtrar en tiempo real al escribir en el buscador o cambiar selects
    function filtrarAnimes() {
        const texto = inputBuscar.value.toLowerCase();
        const tipoSeleccionado = filtroTipo.value;
        const estadoSeleccionado = filtroEstado.value;

        const filtrados = todosLosAnimes.filter(anime => {
            const coincideTexto = anime.titulo && anime.titulo.toLowerCase().includes(texto) || 
                                  (anime.genero && anime.genero.toLowerCase().includes(texto));
            
            const coincideTipo = tipoSeleccionado === 'Todos' || anime.tipo === tipoSeleccionado;
            const coincideEstado = estadoSeleccionado === 'Todos' || anime.estado === estadoSeleccionado;

            return coincideTexto && coincideTipo && coincideEstado;
        });

        mostrarAnimes(filtrados);
    }

    if (inputBuscar) {
        inputBuscar.addEventListener('input', filtrarAnimes);
    }
    if (filtroTipo) {
        filtroTipo.addEventListener('change', filtrarAnimes);
    }
    if (filtroEstado) {
        filtroEstado.addEventListener('change', filtrarAnimes);
    }
</script>
</body>
</html>
