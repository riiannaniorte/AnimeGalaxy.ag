<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AnimeGalaxy 🌟</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #2c3e50, #4ca1af);
      color: white;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      background-color: #111;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 1000;
      box-sizing: border-box;
    }

    .navbar-brand {
      font-size: 1.3em;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* ===== MENU PRINCIPAL ===== */
    .navbar-menu {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    .navbar-menu li {
      position: relative;
    }

    .navbar-menu a {
      color: white;
      text-decoration: none;
      font-size: 1em;
      display: block;
      padding: 8px 10px;
      transition: color 0.3s ease;
    }

    .navbar-menu a:hover {
      color: orange;
    }

    /* ===== SUBMENÚ ===== */
    .sub-menu {
      list-style: none;
      background: #222;
      position: absolute;
      top: 40px;
      left: 0;
      min-width: 200px;
      border-radius: 5px;
      display: none;
      flex-direction: column;
      padding: 0;
      box-shadow: 0 5px 10px rgba(0,0,0,0.4);
    }

    .sub-menu li a {
      padding: 10px;
      color: #fff;
      text-decoration: none;
      font-size: 0.95em;
    }

    .sub-menu li a:hover {
      background: #333;
      color: orange;
    }

    /* Mostrar submenú al pasar el mouse en PC */
    @media (min-width: 901px) {
      .sub-menu-toggle:hover .sub-menu {
        display: flex;
      }
    }

    /* ===== MENU HAMBURGUESA ===== */
    .menu-toggle {
      display: none;
      flex-direction: column;
      cursor: pointer;
    }

    .menu-toggle span {
      background: white;
      height: 3px;
      width: 25px;
      margin: 4px 0;
      border-radius: 5px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .navbar {
        flex-wrap: wrap;
      }

      .menu-toggle {
        display: flex;
      }

      .navbar-menu {
        display: none;
        width: 100%;
        flex-direction: column;
        background-color: #111;
        border-top: 1px solid #333;
        margin-top: 10px;
        transition: all 0.3s ease;
      }

      .navbar-menu.active {
        display: flex;
      }

      .navbar-menu li {
        width: 100%;
      }

      .navbar-menu a {
        padding: 12px 20px;
        width: 100%;
      }

      /* Submenú móvil */
      .sub-menu {
        position: static;
        background: #1a1a1a;
        display: none;
        flex-direction: column;
        box-shadow: none;
      }

      .sub-menu-toggle.active .sub-menu {
        display: flex;
      }

      .sub-menu-toggle > a::after {
        content: " ▼";
        font-size: 0.8em;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-brand">AnimeGalaxy 🌟</div>

    <div class="menu-toggle" id="menu-toggle">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <ul class="navbar-menu" id="navbarMenu">
      <li><a href="index.html">🏠 Inicio</a></li>
      <li><a href="ventas.html">🎬 Directorio Anime</a></li>
      <li><a href="visto.html">✅ Animes Vistos</a></li>
      <li><a href="pre-registro.html">🔐 Pre-registro</a></li>

      <li class="sub-menu-toggle">
        <a href="#">💬 Foro</a>
        <ul class="sub-menu">
          <li><a href="anime.html">📺 Anime</a></li>
          <li><a href="manga.html">📚 Manga</a></li>
          <li><a href="crear_publicacion.html">📝 Crear Publicación</a></li>
        </ul>
      </li>

      <li><a href="quienes_somos.html">👥 Quiénes Somos</a></li>
      <li><a href="contacto.html">✉️ Contacto</a></li>
    </ul>
  </nav>

  <script>
    // ===== MENÚ HAMBURGUESA =====
    const menuToggle = document.getElementById('menu-toggle');
    const navbarMenu = document.getElementById('navbarMenu');
    const subMenuToggles = document.querySelectorAll('.sub-menu-toggle');

    // Mostrar / ocultar menú principal
    menuToggle.addEventListener('click', () => {
      navbarMenu.classList.toggle('active');
    });

    // Submenús (solo móviles)
    subMenuToggles.forEach(toggle => {
      toggle.addEventListener('click', (e) => {
        if (window.innerWidth <= 900) {
          e.preventDefault(); // Evita que el enlace recargue
          e.stopPropagation(); // No cierre otros menús
          toggle.classList.toggle('active');
        }
      });
    });

    // Cierra menú al hacer clic fuera (móvil)
    document.addEventListener('click', (e) => {
      if (!navbarMenu.contains(e.target) && !menuToggle.contains(e.target)) {
        navbarMenu.classList.remove('active');
        subMenuToggles.forEach(t => t.classList.remove('active'));
      }
    });
  </script>

</body>
</html>
