<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Mi Sitio de Anime</title>
    <link rel="stylesheet" href="styless.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

    <nav class="navbar-menu">
        <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
        <a href="buscar_anime.html"><i class="fas fa-film"></i> Directorio Anime</a>
        <a href="foro.html"><i class="fas fa-comments"></i> Foro</a>
        <a href="quienes_somos.html"><i class="fas fa-users"></i> Quiénes Somos</a>
        <a href="contacto.html"><i class="fas fa-envelope"></i> Contacto</a>
        
        <div class="dropdown">
            <a href="#"><i class="fas fa-user"></i> Perfil <i class="fas fa-caret-down"></i></a>
            <div class="dropdown-content perfil-content">
                <div class="perfil-info">
                    <img src="https://via.placeholder.com/80/555555/555555" alt="Foto de usuario" class="perfil-foto">
                    <h3 class="perfil-nombre"><span id="perfil-nombre">NombreUsuario</span></h3>
                </div>
                <a href="editar_perfil.html">Editar Perfil</a> 
                <a href="mi_lista.html">Mi Lista</a>
                <a href="#" id="cerrar-sesion">Cerrar Sesión</a>
            </div>
        </div>
    </nav>
    <div class="contenedor-principal">
        <h1><i class="fas fa-user-edit"></i> Editar Perfil</h1>

        <form action="/guardar_perfil" method="POST" class="formulario-perfil" enctype="multipart/form-data">
            
            <div class="campo-foto">
                <img src="https://via.placeholder.com/150/555555/555555" alt="Foto de Perfil" class="foto-actual">
                <label for="nueva-foto" class="boton-subir">
                    <i class="fas fa-camera"></i> Cambiar Foto
                </label>
                <input type="file" id="nueva-foto" name="nueva-foto" accept="image/*" style="display: none;">
            </div>

            <div class="campo">
                <label for="nombre-usuario">Nombre de Usuario:</label>
                <input type="text" id="nombre-usuario" name="nombre-usuario" value="NombreUsuario" required>
            </div>

            <div class="campo">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" value="correo@ejemplo.com" required>
            </div>

            <div class="campo">
                <label for="bio">Biografía / Acerca de mí:</label>
                <textarea id="bio" name="bio" rows="4">¡Fanático del anime de acción y fantasía!</textarea>
            </div>
            
            <button type="submit" class="boton-guardar"><i class="fas fa-save"></i> Guardar Cambios</button>

        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const formulario = document.querySelector('.formulario-perfil');
            const fotoActualElemento = document.querySelector('.foto-actual');
            const inputNuevaFoto = document.getElementById('nueva-foto');
            // Elementos del menú (dropdown)
            const spanNombreMenu = document.getElementById('perfil-nombre');
            const fotoMenuElemento = document.querySelector('.perfil-foto');
            
            // Campos del formulario
            const inputNombreUsuario = document.getElementById('nombre-usuario');
            const inputCorreo = document.getElementById('correo');
            const textareaBio = document.getElementById('bio');

            // --- 1. FUNCIÓN PARA CARGAR DATOS AL INICIAR LA PÁGINA ---
            function cargarDatos() {
                // Si no hay datos guardados, usa los valores por defecto del HTML
                
                const nombreGuardado = localStorage.getItem('perfil_nombre') || inputNombreUsuario.value;
                inputNombreUsuario.value = nombreGuardado;
                spanNombreMenu.textContent = nombreGuardado;

                const correoGuardado = localStorage.getItem('perfil_correo') || inputCorreo.value;
                inputCorreo.value = correoGuardado;

                const bioGuardada = localStorage.getItem('perfil_bio') || textareaBio.value;
                textareaBio.value = bioGuardada;
                
                // Usamos un placeholder simple gris como valor inicial
                const fotoDefault = 'https://via.placeholder.com/150/555555/555555'; 
                const fotoMenuDefault = 'https://via.placeholder.com/80/555555/555555';
                
                const fotoGuardada = localStorage.getItem('perfil_foto_url') || fotoDefault;
                fotoActualElemento.src = fotoGuardada;
                
                // Actualizar la foto en el menú (usa el tamaño de 80px si es el placeholder)
                fotoMenuElemento.src = fotoGuardada.includes('150') ? fotoGuardada.replace('150', '80') : fotoGuardada;
            }

            // --- 2. FUNCIÓN PARA PREVISUALIZAR Y PROCESAR LA NUEVA FOTO ---
            inputNuevaFoto.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        // Previsualiza la imagen en el formulario (150px)
                        fotoActualElemento.src = e.target.result; 
                    }
                    reader.readAsDataURL(file); // Guarda como URL base64
                }
            });

            // --- 3. FUNCIÓN PARA GUARDAR DATOS LOCALMENTE AL ENVIAR EL FORMULARIO ---
            formulario.addEventListener('submit', (e) => {
                e.preventDefault(); 
                
                // Guardar todos los campos de texto
                const nuevoNombre = inputNombreUsuario.value;
                localStorage.setItem('perfil_nombre', nuevoNombre);
                localStorage.setItem('perfil_correo', inputCorreo.value);
                localStorage.setItem('perfil_bio', textareaBio.value);

                // Guardar la URL de la foto (base64 o placeholder)
                const nuevaFotoURL = fotoActualElemento.src;
                localStorage.setItem('perfil_foto_url', nuevaFotoURL);
                
                // Actualizar la interfaz (menú y formulario)
                spanNombreMenu.textContent = nuevoNombre;
                fotoMenuElemento.src = nuevaFotoURL;

                alert('✅ ¡Perfil actualizado! Los cambios se han guardado en tu navegador.');
            });

            // Ejecutar la función de carga al inicio
            cargarDatos();
        });
    </script>

</body>
</html>
