<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Punch Man - Temporada 3</title>
<link rel="stylesheet" href="styless.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
/* ========================
   Diseño AnimeFLV
======================== */
.anime-header {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: flex-start;
}

.anime-img {
  width: 180px;
  height: 260px;
  object-fit: cover;
  border-radius: 10px;
  flex-shrink: 0;
}

.anime-info {
  flex: 1;
}

.anime-info h1 {
  color: #ff3c3c;
  margin-bottom: 10px;
  font-size: 1.5rem;
}

.anime-info p {
  color: #ddd;
  font-size: 0.9rem;
  line-height: 1.4;
}

/* Cards de capítulos tipo AnimeFLV */
.capitulo-container {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 10px 0;
  scrollbar-width: thin;
  scrollbar-color: #ff3c3c #1a1a1a;
}

.capitulo-container::-webkit-scrollbar {
  height: 8px;
}

.capitulo-container::-webkit-scrollbar-track {
  background: #1a1a1a;
  border-radius: 4px;
}

.capitulo-container::-webkit-scrollbar-thumb {
  background-color: #ff3c3c;
  border-radius: 4px;
}

.capitulo-card {
  flex: 0 0 130px;
  background-color: #2a2a2a;
  border-radius: 8px;
  text-align: center;
  padding: 5px;
  font-size: 0.8rem;
  transition: transform 0.3s, box-shadow 0.3s;
}

.capitulo-card img {
  width: 100%;
  height: 80px;
  object-fit: cover;
  border-radius: 5px;
  margin-bottom: 5px;
  cursor: pointer;
}

.capitulo-card span {
  display: block;
  margin-bottom: 5px;
  color: #fff;
}

.capitulo-card button {
  padding: 3px 7px;
  font-size: 0.8rem;
  border-radius: 4px;
  border: none;
  background-color: #ff3c3c;
  color: #fff;
  cursor: pointer;
}

.capitulo-card button:hover {
  background-color: #e63232;
}

/* Flechas scroll */
.scroll-wrapper {
  position: relative;
}

.scroll-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background-color: rgba(255,60,60,0.8);
  border: none;
  color: white;
  font-size: 20px;
  padding: 8px;
  cursor: pointer;
  border-radius: 5px;
  opacity: 0;
  transition: opacity 0.3s, background-color 0.3s;
  z-index: 10;
}

.scroll-wrapper:hover .scroll-btn {
  opacity: 1;
}

.scroll-btn.left {
  left: 0;
}

.scroll-btn.right {
  right: 0;
}
</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <div class="navbar-brand">
    <img src="https://drive.google.com/uc?export=view&id=1snA7nhE3vNeix-iXoUGH_sU7Yg531aAy" alt="AnimeGalaxy Logo" class="navbar-logo">
    <span>AnimeGalaxy</span>
  </div>
  <div class="navbar-menu">
    <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
    <a href="Directorio_anime.html"><i class="fas fa-film"></i> Directorio Anime</a>
    <a href="buscar_anime.html"><i class="fas fa-search"></i> Buscar Anime</a>
    <div class="dropdown">
      <a><i class="fas fa-user"></i> Perfil <i class="fas fa-caret-down"></i></a>
      <div class="dropdown-content">
        <a href="iniciar_sesion.html">Iniciar Sesión</a>
        <a href="mi_lista.html">Mi Lista</a>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <!-- Encabezado -->
  <div class="anime-header">
    <img id="anime-img" src="" alt="Anime" class="anime-img">
    <div class="anime-info">
      <h1 id="anime-title"></h1>
      <p id="anime-sinopsis"></p>
    </div>
  </div>

  <!-- Capítulos -->
  <div class="section">
    <h2>Capítulos</h2>
    <div class="scroll-wrapper">
      <button class="scroll-btn left">&lt;</button>
      <div class="capitulo-container" id="capitulo-container"></div>
      <button class="scroll-btn right">&gt;</button>
    </div>
  </div>
</div>

<!-- Footer -->
<footer>
  <p>© 2025 AnimeGalaxy. Todos los derechos reservados.</p>
  <div class="social-links">
    <a href="#"><i class="fab fa-facebook"></i></a>
    <a href="#"><i class="fab fa-twitter"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-youtube"></i></a>
  </div>
</footer>

<div class="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
  <i class="fas fa-arrow-up"></i>
</div>

<script>
const anime = {
  title: "One Punch Man - Temporada 3",
  image: "https://cdn.atomix.vg/wp-content/uploads/2024/02/Diseno-sin-titulo-2024-02-29T105508.745.png",
  sinopsis: "La tercera temporada de One Punch Man continúa las aventuras de Saitama y Genos mientras enfrentan nuevos enemigos y desafíos. Fecha de estreno: 12 de octubre.",
  capitulos: Array.from({length: 12}, (_, i) => ({
    numero: i+1,
    imagen: "https://cdn.atomix.vg/wp-content/uploads/2024/02/Diseno-sin-titulo-2024-02-29T105508.745.png",
    link: `opm_cap${i+1}.html`
  }))
};

/* Renderizar anime */
document.getElementById("anime-title").textContent = anime.title;
document.getElementById("anime-img").src = anime.image;
document.getElementById("anime-img").alt = anime.title;
document.getElementById("anime-sinopsis").textContent = anime.sinopsis;

const container = document.getElementById("capitulo-container");
anime.capitulos.forEach(c => {
  const card = document.createElement("div");
  card.className = "capitulo-card";
  card.innerHTML = `
    <img src="${c.imagen}" alt="Capítulo ${c.numero}">
    <span>Capítulo ${c.numero}</span>
    <button onclick="window.location.href='${c.link}'">Ver</button>
  `;
  container.appendChild(card);
});

/* Scroll horizontal */
const scrollWrappers = document.querySelectorAll('.scroll-wrapper');
scrollWrappers.forEach(wrapper => {
  const container = wrapper.querySelector('.capitulo-container');
  wrapper.querySelector('.scroll-btn.left').addEventListener('click', ()=>{ container.scrollBy({left:-250, behavior:'smooth'}); });
  wrapper.querySelector('.scroll-btn.right').addEventListener('click', ()=>{ container.scrollBy({left:250, behavior:'smooth'}); });
});
</script>

</body>
</html>
