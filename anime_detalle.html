<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Detalle</title>
<link rel="stylesheet" href="styless.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <div class="navbar-brand">
    <img src="https://drive.google.com/uc?export=view&id=1snA7nhE3vNeix-iXoUGH_sU7Yg531aAy" alt="AnimeGalaxy Logo" class="navbar-logo">
    <span>AnimeGalaxy</span>
  </div>
  <div class="navbar-menu">
    <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
    <a href="Directorio_anime.html"><i class="fas fa-film"></i> Directorio Anime</a>
    <a href="buscar_anime.html"><i class="fas fa-search"></i> Buscar Anime</a>
    <div class="dropdown">
      <a><i class="fas fa-user"></i> Perfil <i class="fas fa-caret-down"></i></a>
      <div class="dropdown-content">
        <a href="iniciar_sesion.html">Iniciar Sesión</a>
        <a href="mi_lista.html">Mi Lista</a>
      </div>
    </div>
  </div>
</div>

<!-- Contenido principal -->
<div class="container">

  <!-- Encabezado del anime -->
  <div class="anime-header">
    <img id="anime-img" src="" alt="Anime" class="anime-img">
    <div class="anime-info">
      <h1 id="anime-title"></h1>
      <p id="anime-sinopsis"></p>
    </div>
  </div>

  <!-- Sección de capítulos -->
  <div class="section">
    <h2>Capítulos</h2>
    <div class="scroll-wrapper">
      <button class="scroll-btn left">&lt;</button>
      <div class="capitulo-container" id="capitulo-container">
        <!-- Las cards se generarán con JS -->
      </div>
      <button class="scroll-btn right">&gt;</button>
    </div>
  </div>

</div>

<!-- Footer -->
<footer>
  <p>© 2025 AnimeGalaxy. Todos los derechos reservados.</p>
  <div class="social-links">
    <a href="#"><i class="fab fa-facebook"></i></a>
    <a href="#"><i class="fab fa-twitter"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-youtube"></i></a>
  </div>
</footer>

<div class="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
  <i class="fas fa-arrow-up"></i>
</div>

<script>
/* ========================
   Datos del anime
======================== */
const anime = {
  title: "One Punch Man - Temporada 3",
  image: "https://cdn.atomix.vg/wp-content/uploads/2024/02/Diseno-sin-titulo-2024-02-29T105508.745.png",
  sinopsis: "La tercera temporada de One Punch Man continúa las aventuras de Saitama y Genos mientras enfrentan nuevos enemigos y desafíos. Fecha de estreno: 12 de octubre.",
  capitulos: [
    {numero: 1, imagen: "https://cdn.atomix.vg/wp-content/uploads/2024/02/Diseno-sin-titulo-2024-02-29T105508.745.png", link: "opm_cap1.html"},
    {numero: 2, imagen: "https://cdn.atomix.vg/wp-content/uploads/2024/02/Diseno-sin-titulo-2024-02-29T105508.745.png", link: "opm_cap2.html"},
    {numero: 3, imagen: "https://cdn.atomix.vg/wp-content/uploads/2024/02/Diseno-sin-titulo-2024-02-29T105508.745.png", link: "opm_cap3.html"},
    {numero: 4, imagen: "https://cdn.atomix.vg/wp-content/uploads/2024/02/Diseno-sin-titulo-2024-02-29T105508.745.png", link: "opm_cap4.html"}
  ]
};

/* ========================
   Renderizar Anime
======================== */
document.getElementById("anime-title").textContent = anime.title;
document.getElementById("anime-img").src = anime.image;
document.getElementById("anime-img").alt = anime.title;
document.getElementById("anime-sinopsis").textContent = anime.sinopsis;

const container = document.getElementById("capitulo-container");
anime.capitulos.forEach(c => {
  const card = document.createElement("div");
  card.className = "capitulo-card";
  card.innerHTML = `
    <img src="${c.imagen}" alt="Capítulo ${c.numero}">
    <span>Capítulo ${c.numero}</span>
    <button onclick="window.location.href='${c.link}'">Ver</button>
  `;
  container.appendChild(card);
});

/* ========================
   Scroll horizontal
======================== */
const scrollWrappers = document.querySelectorAll('.scroll-wrapper');
scrollWrappers.forEach(wrapper => {
  const container = wrapper.querySelector('.capitulo-container');
  const btnLeft = wrapper.querySelector('.scroll-btn.left');
  const btnRight = wrapper.querySelector('.scroll-btn.right');

  btnLeft.addEventListener('click', () => {
    container.scrollBy({ left: -250, behavior: 'smooth' });
  });

  btnRight.addEventListener('click', () => {
    container.scrollBy({ left: 250, behavior: 'smooth' });
  });
});
</script>

</body>
</html>
