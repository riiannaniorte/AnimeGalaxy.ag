<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaiAnime - Animes</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/png" href="DaiAnime.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .filtros-container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .filtros-container select {
            padding: 8px 12px;
            background: #252525;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header class="page-header">
    <h1>
        <a href="index.html">
            <img src="DaiAnime.jpeg" alt="Logo" style="height:40px; vertical-align:middle;">
            DaiAnime
        </a>
    </h1>
    <nav class="main-menu">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="peliculas.html">Películas</a></li>
            <li><a href="series.html">Series</a></li>
            <li><a href="animes.html" class="active">Animes</a></li>
            <li><a href="Buscar.html">Buscar</a></li> 
            <li><a href="admin.html" id="menu-admin">Admin</a></li>
            <li class="user-menu-item">
                <a href="#" id="nombre-usuario">Usuario</a>
                <ul class="user-dropdown">
                    <li><a href="Mi_lista.html">Mi Lista</a></li>
                    <li><a href="favoritos.html">Favoritos</a></li>
                    <li class="logout-separator"><a href="iniciar_sesion.html" onclick="localStorage.removeItem('usuario_conectado');">Cerrar Sesión</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

<h2 class="h3" style="text-align:center; margin-top:20px;">Animes Disponibles</h2>

<!-- Panel de Filtros -->
<div class="filtros-container">
    <label style="color:white; font-weight:bold;">Filtrar por:</label>
    <select id="filtro-genero" onchange="filtrarContenido()">
        <option value="todos">Todos los géneros</option>
    </select>
    <select id="filtro-anio" onchange="filtrarContenido()">
        <option value="todos">Todos los años</option>
    </select>
</div>

<section class="anime-list" id="contenedor-animes">
    <!-- Los animes se cargarán aquí -->
</section>

<footer>
    <p>© 2026 DaiAnime. Todos los derechos reservados.</p>
    <div class="social-links">  
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
    </div>
</footer>

<script>
    let listaGlobalAnimes = [];
    const sheetDbUrl = 'https://sheetdb.io/api/v1/2fm1f2txx7vmc';

    window.addEventListener('DOMContentLoaded', function() {
        const usuarioActual = localStorage.getItem('usuario_conectado');
        const menuAdmin = document.getElementById('menu-admin');
        const nombreUsuarioLink = document.getElementById('nombre-usuario');

        if (usuarioActual && nombreUsuarioLink) {
            nombreUsuarioLink.textContent = usuarioActual;
        }

        if (menuAdmin && usuarioActual !== 'admin') {
            menuAdmin.style.display = 'none';
        }

        cargarAnimes();
    });

    function cargarAnimes() {
        fetch(sheetDbUrl)
            .then(res => res.json())
            .then(datos => {
                listaGlobalAnimes = datos.filter(item => {
                    if (!item.titulo) return false;
                    const cat = item.categoria ? item.categoria.toLowerCase().trim() : '';
                    return cat === 'anime';
                });

                poblarFiltros(listaGlobalAnimes);
                mostrarAnimes(listaGlobalAnimes);
            })
            .catch(err => console.error('Error al cargar animes:', err));
    }

    function poblarFiltros(datos) {
        const selectGenero = document.getElementById('filtro-genero');
        const selectAnio = document.getElementById('filtro-anio');
        
        let generosSet = new Set();
        let aniosSet = new Set();

        datos.forEach(item => {
            if (item.genero) {
                item.genero.split(',').forEach(g => {
                    generosSet.add(g.trim());
                });
            }
            if (item.fecha) {
                let anio = item.fecha.substring(0, 4);
                if (anio) aniosSet.add(anio);
            }
        });

        generosSet.forEach(genero => {
            selectGenero.innerHTML += `<option value="${genero}">${genero}</option>`;
        });

        Array.from(aniosSet).sort().reverse().forEach(anio => {
            selectAnio.innerHTML += `<option value="${anio}">${anio}</option>`;
        });
    }

    function mostrarAnimes(datos) {
        const contenedor = document.getElementById('contenedor-animes');
        contenedor.innerHTML = '';

        if (datos.length === 0) {
            contenedor.innerHTML = '<p style="color: white; padding: 20px; text-align:center; width:100%;">No hay animes con estos filtros.</p>';
            return;
        }

        datos.forEach(item => {
            const rutaImagen = item.imagen ? item.imagen : 'imagenes/anime/default.jpg';
            const linkDetalle = `informacion.html?titulo=${encodeURIComponent(item.titulo)}`;

            contenedor.innerHTML += `
                <div class="anime-card news-card">
                    <a href="${linkDetalle}">
                        <img src="${rutaImagen}" class="anime-img" alt="${item.titulo}" onerror="this.src='imagenes/anime/default.jpg';">
                    </a>
                    <h3 class="anime-title">${item.titulo}</h3>
                    <p class="anime-genre">${item.genero || 'N/A'}</p>
                </div>
            `;
        });
    }

    function filtrarContenido() {
        const generoSeleccionado = document.getElementById('filtro-genero').value;
        const anioSeleccionado = document.getElementById('filtro-anio').value;

        const filtradas = listaGlobalAnimes.filter(item => {
            let cumpleGenero = true;
            let cumpleAnio = true;

            if (generoSeleccionado !== 'todos') {
                if (!item.genero) {
                    cumpleGenero = false;
                } else {
                    const generosItem = item.genero.split(',').map(g => g.trim().toLowerCase());
                    cumpleGenero = generosItem.includes(generoSeleccionado.toLowerCase());
                }
            }

            if (anioSeleccionado !== 'todos') {
                if (!item.fecha || !item.fecha.startsWith(anioSeleccionado)) {
                    cumpleAnio = false;
                }
            }

            return cumpleGenero && cumpleAnio;
        });

        mostrarAnimes(filtradas);
    }
</script>
</body>
</html>
