<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Lista - DaiAnime</title>
    <link rel="stylesheet" href="Buscar.css">
    <link rel="icon" type="image/png" href="DaiAnime.jpeg">
    <style>
        .delete-button {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .delete-button:hover {
            background-color: #d32f2f;
        }
        .mensaje-exito {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<header class="page-header">
    <h1>
        <a href="index.html">
            <img src="DaiAnime.jpeg" style="height:40px; vertical-align:middle;" alt="Logo">
            DaiAnime
        </a>
    </h1>
     <nav class="main-menu">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="Buscar.html">Buscar</a></li> 
            <li><a href="admin.html" id="menu-admin">Admin</a></li>
            <li class="user-menu-item">
                <a href="#" id="nombre-usuario">Usuario</a>
                <ul class="user-dropdown">
                <li><a href="Mi_lista.html">Mi Lista</a></li>
                <li><a href="favoritos.html">Animes Favoritos</a></li>
                <li class="logout-separator"><a href="iniciar_sesion.html" onclick="localStorage.removeItem('usuario_conectado');">Cerrar Sesión</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

<main style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    <h1 style="text-align: center;">Mi Lista</h1>

    <div class="anime-grid" id="contenedor-mi-lista">
        <!-- Los animes de la lista se cargarán aquí dinámicamente -->
    </div>
</main>

<footer>
    <p>© 2026 DaiAnime</p>
</footer>

<script>
    window.addEventListener('DOMContentLoaded', function() {
        const usuarioActual = localStorage.getItem('usuario_conectado');
        const menuAdmin = document.getElementById('menu-admin');
        const nombreUsuarioLink = document.getElementById('nombre-usuario');

        // Si hay un usuario conectado, cambiamos el texto "Usuario" por su nombre
        if (usuarioActual && nombreUsuarioLink) {
            nombreUsuarioLink.textContent = usuarioActual;
        }

        // Ocultar o mostrar el botón de Admin según el rol
        if (menuAdmin) {
            if (usuarioActual !== 'admin') {
                menuAdmin.style.display = 'none';
            }
        }

        // Cargar los animes guardados en Mi Lista
        cargarMiLista();
    });

    function cargarMiLista() {
        const contenedor = document.getElementById('contenedor-mi-lista');
        const miLista = JSON.parse(localStorage.getItem('mi_lista_anime')) || [];

        if (miLista.length === 0) {
            contenedor.innerHTML = '<p style="color: white; text-align: center; grid-column: 1 / -1;">No tienes animes guardados en tu lista.</p>';
            return;
        }

        contenedor.innerHTML = '';

        miLista.forEach(anime => {
            const anio = anime.fecha ? anime.fecha.substring(0, 4) : 'N/D';
            const rutaImagen = anime.imagen ? anime.imagen : 'imagenes/anime/default.jpg';

            const card = document.createElement('div');
            card.className = 'anime-card';
            card.innerHTML = `
                <a href="anime.html">
                    <img src="${rutaImagen}" alt="${anime.titulo}" onerror="this.src='imagenes/anime/default.jpg';">
                </a>
                <div class="anime-details">
                    <p><strong>${anime.titulo}</strong></p>
                    <p><strong>Año:</strong> ${anio}</p>
                    <p><strong>Tipo:</strong> ${anime.tipo || 'N/D'}</p>
                    <p class="sinopsis-corta"><strong>Sinopsis:</strong> ${anime.sinopsis || 'Sin sinopsis.'}</p>
                    
                    <button type="button" class="delete-button" onclick="eliminarDeMiLista('${anime.titulo}')">
                        🗑️ Eliminar
                    </button>
                </div>
            `;
            contenedor.appendChild(card);
        });
    }

    function eliminarDeMiLista(titulo) {
        if (!confirm('¿Estás seguro de eliminar este anime de tu lista?')) return;

        let miLista = JSON.parse(localStorage.getItem('mi_lista_anime')) || [];
        miLista = miLista.filter(a => a.titulo !== titulo);
        localStorage.setItem('mi_lista_anime', JSON.stringify(miLista));
        
        cargarMiLista(); // Recarga la vista de la lista
    }
</script>
</body>
</html>
