<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Favoritos</title>
    <link rel="stylesheet" href="Buscar.css">
    <link rel="icon" type="image/png" href="DaiAnime.jpeg">
    <style>
        .delete-button {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }

        .delete-button:hover {
            background-color: #b71c1c;
        }
    </style>
</head>
<body>

<header class="page-header">
    <h1>
        <a href="index.html">
            <img src="DaiAnime.jpeg" alt="Logo" style="height:40px; vertical-align:middle;">
            DaiAnime
        </a>
    </h1>

     <nav class="main-menu">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="Buscar.html">Buscar</a></li> 
            <li><a href="admin.html" id="menu-admin">Admin</a></li>
            <li class="user-menu-item">
                <a href="#" id="nombre-usuario">Usuario</a>
                <ul class="user-dropdown">
                <li><a href="Mi_lista.html">Mi Lista</a></li>
                <li><a href="favoritos.html">Animes Favoritos</a></li>
                <li class="logout-separator"><a href="iniciar_sesion.html" onclick="localStorage.removeItem('usuario_conectado');">Cerrar Sesión</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

<h1 style="text-align:center; margin:20px;">⭐ Mis Animes Favoritos</h1>

<div class="anime-grid" id="contenedor-favoritos">
    <!-- Los animes favoritos se cargarán aquí dinámicamente -->
</div>

<footer>
    <p style="text-align:center; padding:20px;">© 2026 DaiAnime</p>
</footer>

<script>
    window.addEventListener('DOMContentLoaded', function() {
        const usuarioActual = localStorage.getItem('usuario_conectado');
        const menuAdmin = document.getElementById('menu-admin');
        const nombreUsuarioLink = document.getElementById('nombre-usuario');

        if (usuarioActual && nombreUsuarioLink) {
            nombreUsuarioLink.textContent = usuarioActual;
        }

        if (menuAdmin) {
            if (usuarioActual !== 'admin') {
                menuAdmin.style.display = 'none';
            }
        }

        // Cargar animes favoritos desde el almacenamiento local
        cargarFavoritos();
    });

    function cargarFavoritos() {
        const contenedor = document.getElementById('contenedor-favoritos');
        const favoritos = JSON.parse(localStorage.getItem('favoritos_anime')) || [];

        if (favoritos.length === 0) {
            contenedor.innerHTML = '<p style="color: white; text-align: center; grid-column: 1 / -1;">No tienes animes en favoritos.</p>';
            return;
        }

        contenedor.innerHTML = '';

        favoritos.forEach(anime => {
            const anio = anime.fecha ? anime.fecha.substring(0, 4) : 'N/D';
            const rutaImagen = anime.imagen ? anime.imagen : 'imagenes/anime/default.jpg';

            const card = document.createElement('div');
            card.className = 'anime-card';
            card.innerHTML = `
                <a href="anime.html">
                    <img src="${rutaImagen}" alt="${anime.titulo}" onerror="this.src='imagenes/anime/default.jpg';">
                </a>
                <h4>${anime.titulo}</h4>

                <div class="anime-details">
                    <p><strong>Año:</strong> ${anio}</p>
                    <p><strong>Tipo:</strong> ${anime.tipo || 'N/D'}</p>
                    <p><strong>Estado:</strong> ${anime.estado || 'N/D'}</p>
                    <p><strong>Género:</strong> ${anime.genero || 'N/D'}</p>
                </div>

                <button type="button" class="delete-button" onclick="eliminarFavorito('${anime.titulo}')">
                    🗑️ Eliminar
                </button>
            `;
            contenedor.appendChild(card);
        });
    }

    function eliminarFavorito(titulo) {
        if (!confirm('¿Eliminar de favoritos?')) return;

        let favoritos = JSON.parse(localStorage.getItem('favoritos_anime')) || [];
        favoritos = favoritos.filter(a => a.titulo !== titulo);
        localStorage.setItem('favoritos_anime', JSON.stringify(favoritos));
        
        cargarFavoritos(); // Recarga la lista en pantalla
    }
</script>
</body>
