<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar Anime</title>
<style>
  body { font-family: Arial, sans-serif; background: #222; color: white; }
  .card { display: inline-block; margin: 10px; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; width: 200px; text-align:center; }
  img { width: 100%; border-radius: 10px; }
  button { margin-top: 5px; padding: 5px 10px; cursor: pointer; border-radius:5px; border:none; background:#00ffcc; color:#000; }
  button.tick { background:#4CAF50; color:white; cursor: default; }
</style>
</head>
<body>
<h1>Buscar Anime</h1>
<input type="text" id="searchInput" placeholder="Buscar anime...">
<div id="anime-container"></div>

<script>
const API_BACKEND = 'http://85.85.109.92:3000';

// Buscar anime en la API (simulado, podrías integrar MyAnimeList API)
const animes = [
  {mal_id:1,name:"One Punch Man",image:"https://cdn.atomix.vg/wp-content/uploads/2024/02/Diseno-sin-titulo-2024-02-29T105508.745.png",score:"9.0",synopsis:"Tercera temporada de One Punch Man"},
  {mal_id:2,name:"Dragon Ball Daima",image:"https://www3.animeflv.net/uploads/animes/covers/4081.jpg",score:"8.5",synopsis:"Nueva serie Dragon Ball"}
];

let guardados = [];

async function cargarGuardados(){
  guardados = await fetch(`${API_BACKEND}/animes`).then(r=>r.json());
}

function marcarTick(id){
  const btn = document.querySelector(`button[data-id='${id}']`);
  if(btn){
    btn.textContent = '✅ Guardado';
    btn.classList.add('tick');
    btn.disabled = true;
  }
}

async function renderAnimes(filter=""){
  const container = document.getElementById('anime-container');
  container.innerHTML = '';
  for(const anime of animes){
    if(anime.name.toLowerCase().includes(filter.toLowerCase())){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${anime.image}" alt="${anime.name}">
        <h2>${anime.name}</h2>
        <p>${anime.synopsis}</p>
        <button data-id="${anime.mal_id}">Guardar</button>
      `;
      container.appendChild(card);

      const btn = card.querySelector('button');
      if(guardados.some(a => a.mal_id === anime.mal_id)){
        marcarTick(anime.mal_id);
      } else {
        btn.addEventListener('click', async ()=>{
          await fetch(`${API_BACKEND}/animes`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(anime)
          });
          marcarTick(anime.mal_id);
          guardados.push(anime);
        });
      }
    }
  }
}

// Buscar en tiempo real
document.getElementById('searchInput').addEventListener('input', (e)=>{
  renderAnimes(e.target.value);
});

// Inicializar
(async()=>{
  await cargarGuardados();
  renderAnimes();
})();
</script>
</body>
</html>
