<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar Anime - AnimeGalaxy</title>
<link rel="stylesheet" href="styless.css">
<link rel="icon" href="https://drive.google.com/uc?export=view&id=1snA7nhE3vNeix-iXoUGH_sU7Yg531aAy">
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
<style>
/* Grid estilo AnimeFLV */
.anime-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
  gap: 15px;
  margin-top: 20px;
}

.anime-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
}

.anime-card {
  background: #2a2a2a;
  color: #fff;
  border-radius: 10px;
  padding: 10px;
  font-size: 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.anime-card h2 { font-size: 1rem; margin: 0; }
.anime-card p { font-size: 0.8rem; margin: 0; color: #ddd; }

.anime-card button {
  margin-top: 5px;
  padding: 5px;
  border: none;
  background: #ff3c3c;
  color: #fff;
  border-radius: 5px;
  cursor: pointer;
}
.anime-card button:hover { background: #e63232; }
.tick { background: #4CAF50 !important; cursor: not-allowed !important; }

.pagination { margin-top: 20px; display: flex; gap: 5px; justify-content: center; }
.pagination button {
  padding: 5px 10px; border: none; border-radius: 5px; background: #ff3c3c; color: #fff; cursor: pointer;
}
.pagination button.active { background: #4CAF50; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
.filters select, .filters button { padding: 5px; border-radius: 5px; border: none; background: #333; color: #fff; cursor: pointer; }
.filters button { background: #ff3c3c; }
.filters button:hover { background: #e63232; }

/* Dropdown checkboxes */
.multi-select {
  position: relative;
  display: inline-block;
}
.multi-select .select-box {
  padding: 5px;
  border-radius: 5px;
  background: #333;
  color: #fff;
  cursor: pointer;
  min-width: 120px;
}
.multi-select .checkboxes {
  display: none;
  position: absolute;
  background: #2a2a2a;
  border: 1px solid #444;
  padding: 10px;
  z-index: 100;
  max-height: 200px;
  overflow-y: auto;
}
.multi-select.active .checkboxes { display: block; }
.multi-select .checkboxes label {
  display: block;
  margin-bottom: 5px;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="content-wrapper">

  <!-- Navbar -->
  <div class="navbar">
    <div class="navbar-brand">
      <img src="https://drive.google.com/uc?export=view&id=1snA7nhE3vNeix-iXoUGH_sU7Yg531aAy" alt="AnimeGalaxy Logo" class="navbar-logo">
      <span>AnimeGalaxy</span>
    </div>
    <div class="navbar-menu">
      <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
      <a href="Directorio_anime.html"><i class="fas fa-film"></i> Directorio Anime</a>
      <a href="foro.html"><i class="fas fa-comments"></i> Foro</a>
      <a href="quienes_somos.html"><i class="fas fa-users"></i> Quiénes Somos</a>
      <a href="contacto.html"><i class="fas fa-envelope"></i> Contacto</a>
      <div class="dropdown">
        <a href="#"><i class="fas fa-user"></i> Perfil <i class="fas fa-caret-down"></i></a>
        <div class="dropdown-content">
          <a href="iniciar_sesion.html">Iniciar Sesión</a>
          <a href="mi_lista.html">Mi Lista</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenido -->
  <div class="container">
    <h1>Buscar Anime</h1>
    <input type="text" id="searchInput" placeholder="Buscar anime..." class="search-input">

    <!-- Filtros -->
    <div class="filters">

      <!-- Género multi-select -->
      <div class="multi-select" id="multiGenero">
        <div class="select-box">Género</div>
        <div class="checkboxes">
          <label><input type="checkbox" value="Acción"> Acción</label>
          <label><input type="checkbox" value="Comedia"> Comedia</label>
          <label><input type="checkbox" value="Fantasía"> Fantasía</label>
          <label><input type="checkbox" value="Drama"> Drama</label>
          <label><input type="checkbox" value="Aventura"> Aventura</label>
          <label><input type="checkbox" value="Superpoderes"> Superpoderes</label>
        </div>
      </div>

      <!-- Año multi-select -->
      <div class="multi-select" id="multiYear">
        <div class="select-box">Año</div>
        <div class="checkboxes">
          <label><input type="checkbox" value="2025"> 2025</label>
          <label><input type="checkbox" value="2024"> 2024</label>
          <label><input type="checkbox" value="2023"> 2023</label>
          <label><input type="checkbox" value="2022"> 2022</label>
          <label><input type="checkbox" value="2020"> 2020</label>
        </div>
      </div>

      <select id="filterTipo">
        <option value="Todos">Tipo: Todos</option>
        <option value="TV">TV</option>
        <option value="Movie">Movie</option>
        <option value="OVA">OVA</option>
      </select>

      <select id="filterEstado">
        <option value="Todos">Estado: Todos</option>
        <option value="Emisión">Emisión</option>
        <option value="Finalizado">Finalizado</option>
      </select>

      <select id="filterOrden">
        <option value="Por Defecto">Orden: Por Defecto</option>
        <option value="A-Z">A-Z</option>
        <option value="Z-A">Z-A</option>
        <option value="Más Recientes">Más Recientes</option>
        <option value="Más Antiguos">Más Antiguos</option>
      </select>

      <button id="btnFiltrar">FILTRAR</button>
    </div>

    <div id="anime-grid" class="anime-grid"></div>
    <div id="pagination" class="pagination"></div>
  </div>

</div>

<script>
// Datos simplificados
const animes = [
  {id:1,name:"One Punch Man",image:"https://cdn.atomix.vg/wp-content/uploads/2024/02/Diseno-sin-titulo-2024-02-29T105508.745.png",synopsis:"Tercera temporada",year:"2024",genre:"Acción, Comedia",episodes:"12",type:"TV",status:"Finalizado"},
  {id:2,name:"Dragon Ball Daima",image:"https://www3.animeflv.net/uploads/animes/covers/4081.jpg",synopsis:"Nueva serie Dragon Ball",year:"2025",genre:"Aventura, Acción",episodes:"24",type:"TV",status:"Emisión"},
  {id:3,name:"Attack on Titan",image:"https://www3.animeflv.net/uploads/animes/covers/3455.jpg",synopsis:"Conclusión épica",year:"2023",genre:"Acción, Drama",episodes:"16",type:"TV",status:"Finalizado"}
];

let guardados = JSON.parse(localStorage.getItem('miLista')) || [];
const itemsPerPage = 12;
let currentPage = 1;

// Tick guardado
function marcarTick(btn) {
  btn.textContent = '✅ Guardado';
  btn.classList.add('tick');
  btn.disabled = true;
}

// Render Animes
function renderAnimesPage(filteredAnimes, page=1) {
  const container = document.getElementById('anime-grid');
  container.innerHTML = '';
  const start = (page-1)*itemsPerPage;
  const end = start+itemsPerPage;
  const pageItems = filteredAnimes.slice(start,end);

  if(pageItems.length===0){
    container.innerHTML='<p>No se encontraron resultados.</p>';
    document.getElementById('pagination').innerHTML='';
    return;
  }

  pageItems.forEach(anime=>{
    const card=document.createElement('div');
    card.className='anime-card';
    card.innerHTML=`
      <img src="${anime.image}" alt="${anime.name}">
      <h2>${anime.name}</h2>
      <p><strong>Año:</strong> ${anime.year || 'N/A'}</p>
      <p><strong>Género:</strong> ${anime.genre || 'N/A'}</p>
      <p><strong>Tipo:</strong> ${anime.type || 'N/A'}</p>
      <p><strong>Estado:</strong> ${anime.status || 'N/A'}</p>
      <p><strong>Episodios:</strong> ${anime.episodes || 'N/A'}</p>
      <p>${anime.synopsis}</p>
      <button>Guardar</button>
    `;
    const btn=card.querySelector('button');
    if(guardados.some(a=>a.id===anime.id)) marcarTick(btn);
    else btn.addEventListener('click',()=>{
      guardados.push(anime);
      localStorage.setItem('miLista',JSON.stringify(guardados));
      marcarTick(btn);
    });
    container.appendChild(card);
  });

  renderPagination(filteredAnimes.length,page);
}

// Paginación
function renderPagination(totalItems,page){
  const totalPages=Math.ceil(totalItems/itemsPerPage);
  const container=document.getElementById('pagination');
  container.innerHTML='';
  for(let i=1;i<=totalPages;i++){
    const btn=document.createElement('button');
    btn.textContent=i;
    if(i===page) btn.classList.add('active');
    btn.addEventListener('click',()=>{currentPage=i;filterAndRender();});
    container.appendChild(btn);
  }
}

// Filtrar y render
function filterAndRender(){
  const query=document.getElementById('searchInput').value.toLowerCase();
  const generoSelected=Array.from(document.querySelectorAll('#multiGenero input:checked')).map(i=>i.value);
  const yearSelected=Array.from(document.querySelectorAll('#multiYear input:checked')).map(i=>i.value);
  const tipo=document.getElementById('filterTipo').value;
  const estado=document.getElementById('filterEstado').value;
  const orden=document.getElementById('filterOrden').value;

  let filtered=animes.filter(a=>a.name.toLowerCase().includes(query));

  if(generoSelected.length>0) filtered=filtered.filter(a=>a.genre && generoSelected.some(g=>a.genre.includes(g)));
  if(yearSelected.length>0) filtered=filtered.filter(a=>yearSelected.includes(a.year));
  if(tipo!=="Todos") filtered=filtered.filter(a=>a.type===tipo);
  if(estado!=="Todos") filtered=filtered.filter(a=>a.status===estado);

  if(orden==="A-Z") filtered.sort((a,b)=>a.name.localeCompare(b.name));
  else if(orden==="Z-A") filtered.sort((a,b)=>b.name.localeCompare(a.name));
  else if(orden==="Más Recientes") filtered.sort((a,b)=>Number(b.year)-Number(a.year));
  else if(orden==="Más Antiguos") filtered.sort((a,b)=>Number(a.year)-Number(b.year));

  renderAnimesPage(filtered,currentPage);
}

// Eventos
document.getElementById('searchInput').addEventListener('input',()=>{currentPage=1;filterAndRender();});
document.getElementById('btnFiltrar').addEventListener('click',()=>{currentPage=1;filterAndRender();});

// Dropdown toggle
document.querySelectorAll('.multi-select').forEach(ms=>{
  ms.querySelector('.select-box').addEventListener('click',()=>ms.classList.toggle('active'));
});

filterAndRender();
</script>
</body>
</html>
