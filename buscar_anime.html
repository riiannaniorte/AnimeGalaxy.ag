  <!-- Contenido -->

    <h1>Buscar Anime</h1>
    <input type="text" id="searchInput" placeholder="Buscar anime..." class="search-input">
    <div class="card-container" id="anime-container"></div>
  </div>

</div>

<script>
const animes = [
  {id:1,name:"One Punch Man",image:"https://cdn.atomix.vg/wp-content/uploads/2024/02/Diseno-sin-titulo-2024-02-29T105508.745.png",synopsis:"Tercera temporada de One Punch Man"},
  {id:2,name:"Dragon Ball Daima",image:"https://www3.animeflv.net/uploads/animes/covers/4081.jpg",synopsis:"Nueva serie Dragon Ball"},
  {id:3,name:"Kimetsu no Yaiba",image:"https://i.blogs.es/1c4a1a/kimetsu-no-yaiba-the-movie-mugen-train/1366_2000.jpeg",synopsis:"La historia de Tanjiro continúa"},
  {id:4,name:"Attack on Titan",image:"https://www3.animeflv.net/uploads/animes/covers/3455.jpg",synopsis:"La conclusión épica de Attack on Titan"}
];

let guardados = JSON.parse(localStorage.getItem('miLista')) || [];

function marcarTick(id, btn){
  btn.textContent = '✅ Guardado';
  btn.classList.add('tick');
  btn.disabled = true;
}

function renderAnimes(filter=""){
  const container = document.getElementById('anime-container');
  container.innerHTML = '';
  for(const anime of animes){
    if(anime.name.toLowerCase().includes(filter.toLowerCase())){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${anime.image}" alt="${anime.name}">
        <h2>${anime.name}</h2>
        <p>${anime.synopsis}</p>
        <button data-id="${anime.id}">Guardar</button>
      `;
      container.appendChild(card);

      const btn = card.querySelector('button');
      if(guardados.some(a => a.id === anime.id)){
        marcarTick(anime.id, btn);
      } else {
        btn.addEventListener('click', ()=>{
          guardados.push(anime);
          localStorage.setItem('miLista', JSON.stringify(guardados));
          marcarTick(anime.id, btn);
        });
      }
    }
  }
}

document.getElementById('searchInput').addEventListener('input', e=>{
  renderAnimes(e.target.value);
});

renderAnimes();
</script>

</body>
