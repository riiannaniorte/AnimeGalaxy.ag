<style>
/* Grid estilo AnimeFLV */
.anime-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
  gap: 15px;
  margin-top: 20px;
}

.anime-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
}

.anime-card {
  background: #2a2a2a;
  color: #fff;
  border-radius: 10px;
  padding: 10px;
  font-size: 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.anime-card h2 {
  font-size: 1rem;
  margin: 0;
}

.anime-card p {
  font-size: 0.8rem;
  margin: 0;
  color: #ddd;
}

.anime-card button {
  margin-top: 5px;
  padding: 5px;
  border: none;
  background: #ff3c3c;
  color: #fff;
  border-radius: 5px;
  cursor: pointer;
}

.anime-card button:hover {
  background: #e63232;
}

.tick {
  background: #4CAF50 !important;
  cursor: not-allowed !important;
}

.pagination {
  margin-top: 20px;
  display: flex;
  gap: 5px;
  justify-content: center;
}

.pagination button {
  padding: 5px 10px;
  border: none;
  border-radius: 5px;
  background: #ff3c3c;
  color: #fff;
  cursor: pointer;
}

.pagination button.active {
  background: #4CAF50;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
  margin-bottom: 15px;
}

.filters select, .filters button {
  padding: 5px;
  border-radius: 5px;
  border: none;
  background: #333;
  color: #fff;
  cursor: pointer;
}

.filters button {
  background: #ff3c3c;
}

.filters button:hover {
  background: #e63232;
}
</style>
</head>

    <!-- Filtros -->
    <div class="filters">
      <select id="filterGenero" multiple size="5">
        <option value="Acción">Acción</option>
        <option value="Comedia">Comedia</option>
        <option value="Fantasía">Fantasía</option>
        <option value="Drama">Drama</option>
        <option value="Aventura">Aventura</option>
        <option value="Superpoderes">Superpoderes</option>
      </select>

      <select id="filterYear" multiple size="5">
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2020">2020</option>
      </select>

      <select id="filterTipo">
        <option value="Todos">Tipo: Todos</option>
        <option value="TV">TV</option>
        <option value="Movie">Movie</option>
        <option value="OVA">OVA</option>
      </select>

      <select id="filterEstado">
        <option value="Todos">Estado: Todos</option>
        <option value="Emisión">Emisión</option>
        <option value="Finalizado">Finalizado</option>
      </select>

      <select id="filterOrden">
        <option value="Por Defecto">Orden: Por Defecto</option>
        <option value="A-Z">A-Z</option>
        <option value="Z-A">Z-A</option>
        <option value="Más Recientes">Más Recientes</option>
        <option value="Más Antiguos">Más Antiguos</option>
      </select>

      <button id="btnFiltrar">FILTRAR</button>
    </div>

    <div id="anime-grid" class="anime-grid"></div>
    <div id="pagination" class="pagination"></div>
  </div>

</div>

  {id:39,name:"Tokyo Ghoul",image:"https://www3.animeflv.net/uploads/animes/covers/418.jpg",synopsis:"Ghouls y humanos coexistiendo"},
  {id:40,name:"Akudama Drive",image:"https://www3.animeflv.net/uploads/animes/covers/419.jpg",synopsis:"Criminales en una ciudad futurista"},
  {id:41,name:"Hellsing Ultimate",image:"https://www3.animeflv.net/uploads/animes/covers/420.jpg",synopsis:"Vampiros y operaciones secretas"},
  {id:42,name:"Code Geass",image:"https://www3.animeflv.net/uploads/animes/covers/421.jpg",synopsis:"Lelouch lucha contra un imperio"},
  {id:43,name:"Cowboy Bebop",image:"https://www3.animeflv.net/uploads/animes/covers/422.jpg",synopsis:"Cazarrecompensas en el espacio"},
  {id:44,name:"Neon Genesis Evangelion",image:"https://www3.animeflv.net/uploads/animes/covers/423.jpg",synopsis:"Mechas y drama psicológico"}
];

let guardados = JSON.parse(localStorage.getItem('miLista')) || [];
const itemsPerPage = 12;
let currentPage = 1;

function marcarTick(btn) {
  btn.textContent = '✅ Guardado';
  btn.classList.add('tick');
  btn.disabled = true;
  btn.animate([
    { transform: 'scale(1)' },
    { transform: 'scale(1.2)' },
    { transform: 'scale(1)' }
  ], { duration: 300 });
}

function renderAnimesPage(filteredAnimes, page=1) {
  const container = document.getElementById('anime-grid');
  container.innerHTML = '';
  const start = (page - 1) * itemsPerPage;
  const end = start + itemsPerPage;
  const pageItems = filteredAnimes.slice(start, end);

  if(pageItems.length === 0) {
    container.innerHTML = '<p>No se encontraron resultados.</p>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  pageItems.forEach(anime => {
    const card = document.createElement('div');
    card.className = 'anime-card';
    card.innerHTML = `
      <img src="${anime.image}" alt="${anime.name}">
      <h2>${anime.name}</h2>
      <p><strong>Año:</strong> ${anime.year || 'N/A'}</p>
      <p><strong>Género:</strong> ${anime.genre || 'N/A'}</p>
      <p><strong>Tipo:</strong> ${anime.type || 'N/A'}</p>
      <p><strong>Estado:</strong> ${anime.status || 'N/A'}</p>
      <p><strong>Episodios:</strong> ${anime.episodes || 'N/A'}</p>
      <p>${anime.synopsis}</p>
      <button>Guardar</button>
    `;
    const btn = card.querySelector('button');
    if(guardados.some(a => a.id === anime.id)) marcarTick(btn);
    else btn.addEventListener('click', ()=>{
      guardados.push(anime);
      localStorage.setItem('miLista', JSON.stringify(guardados));
      marcarTick(btn);
    });
    container.appendChild(card);
  });

  renderPagination(filteredAnimes.length, page);
}

function renderPagination(totalItems, page) {
  const totalPages = Math.ceil(totalItems / itemsPerPage);
  const container = document.getElementById('pagination');
  container.innerHTML = '';
  for(let i=1;i<=totalPages;i++){
    const btn = document.createElement('button');
    btn.textContent = i;
    if(i===page) btn.classList.add('active');
    btn.addEventListener('click', ()=> {
      currentPage = i;
      filterAndRender();
    });
    container.appendChild(btn);
  }
}

function filterAndRender() {
  const query = document.getElementById('searchInput').value.toLowerCase();

  const generoSelected = Array.from(document.getElementById('filterGenero').selectedOptions).map(o => o.value);
  const yearSelected = Array.from(document.getElementById('filterYear').selectedOptions).map(o => o.value);
  const tipo = document.getElementById('filterTipo').value;
  const estado = document.getElementById('filterEstado').value;
  const orden = document.getElementById('filterOrden').value;

  let filtered = animes.filter(a => a.name.toLowerCase().includes(query));

  if(generoSelected.length > 0) filtered = filtered.filter(a => a.genre && generoSelected.some(g => a.genre.includes(g)));
  if(yearSelected.length > 0) filtered = filtered.filter(a => yearSelected.includes(a.year));
  if(tipo !== "Todos") filtered = filtered.filter(a => a.type === tipo);
  if(estado !== "Todos") filtered = filtered.filter(a => a.status === estado);

  if(orden === "A-Z") filtered.sort((a,b)=>a.name.localeCompare(b.name));
  else if(orden === "Z-A") filtered.sort((a,b)=>b.name.localeCompare(a.name));
  else if(orden === "Más Recientes") filtered.sort((a,b)=>Number(b.year)-Number(a.year));
  else if(orden === "Más Antiguos") filtered.sort((a,b)=>Number(a.year)-Number(b.year));

  renderAnimesPage(filtered, currentPage);
}

document.getElementById('searchInput').addEventListener('input', ()=>{
  currentPage = 1;
  filterAndRender();
});

document.getElementById('btnFiltrar').addEventListener('click', ()=>{
  currentPage = 1;
  filterAndRender();
});

// Inicial
filterAndRender();
</script>
