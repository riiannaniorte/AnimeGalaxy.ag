<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - AnimeGalaxy</title>
  <style>
    body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #222; color: #fff; }
    .box { background: rgba(0,0,0,0.7); padding: 30px; border-radius: 10px; text-align: center; }
    input { display: block; margin: 10px 0; padding: 10px; width: 100%; border-radius: 5px; border: none; }
    button { padding: 10px; width: 100%; border: none; border-radius: 5px; background: #00e0ff; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Iniciar Sesión</h2>
    <input type="email" id="email" placeholder="Correo electrónico" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <button onclick="login()">Iniciar Sesión</button>
    <p>¿No tienes cuenta? <a href="registro.html">Registrarte</a></p>
  </div>

  <script>
    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const usuario = JSON.parse(localStorage.getItem('usuario'));

      if(usuario && usuario.email === email && usuario.password === password){
        alert(`Inicio de sesión exitoso. ¡Bienvenido, ${usuario.username}!`);
        // Aquí puedes redirigir a tu página principal
        window.location.href = 'index.html';
      } else {
        alert('Usuario o contraseña incorrectos');
      }
    }
  </script>
</body>
</html>
