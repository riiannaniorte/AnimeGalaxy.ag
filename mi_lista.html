<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Lista de Animes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
:root { --primary-color:#00ffcc; --secondary-color:#ffcc00; --navbar-bg: rgba(0,0,0,0.8); --text-color:white; }
body { margin:0; font-family:Arial, sans-serif; background:linear-gradient(to right,#333,#444); color:var(--text-color);}
.navbar { background: var(--navbar-bg); padding:10px 20px; display:flex; justify-content: space-between; align-items:center; position:fixed; width:100%; top:0; z-index:1000; border-bottom:3px solid var(--primary-color);}
.navbar a { color: var(--text-color); text-decoration:none; margin:0 10px;}
h1 { text-align:center; margin-top:100px; }
.search-box { text-align:center; margin-top:20px;}
.search-box input { width:50%; padding:10px; border-radius:5px; border:none;}
.anime-list { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-top:20px;}
.anime-card { background: rgba(0,0,0,0.3); border-radius:10px; padding:10px; width:200px; text-align:center;}
.anime-card img { width:100%; border-radius:10px; height:250px; object-fit:cover; cursor:pointer;}
.anime-card h4 { margin:10px 0 5px; color: var(--secondary-color); cursor:pointer;}
.anime-card p { font-size:0.9em; color:#ddd; }
.anime-card button { margin-top:5px; padding:5px 10px; border:none; border-radius:5px; background:#ff4d4d; color:white; cursor:pointer;}
.anime-card button:hover { background:#ff3333; }
</style>
</head>
<body>

<div class="navbar">
    <a href="buscar_anime.html">Buscar Anime</a>
    <a href="mi_lista.html">Mi Lista</a>
</div>

<h1>Mi Lista de Animes</h1>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar en tu lista..." onkeyup="filtrarLista()">
</div>

<div class="anime-list" id="animeList"></div>

<script>
const API_BACKEND = 'http://localhost:3000';
let animes = [];

async function cargarLista() {
    const res = await fetch(`${API_BACKEND}/animes`);
    animes = await res.json();
    renderList();
}

function renderList(filtro='') {
    const div = document.getElementById('animeList');
    div.innerHTML = '';
    animes.filter(a => a.name.toLowerCase().includes(filtro.toLowerCase()))
          .forEach((anime,index)=>{
        const card = document.createElement('div');
        card.className='anime-card';
        card.innerHTML = `
            <img src="${anime.image}" alt="${anime.name}" onclick="window.open('https://myanimelist.net/anime/${anime.mal_id}','_blank')">
            <h4 onclick="window.open('https://myanimelist.net/anime/${anime.mal_id}','_blank')">${anime.name}</h4>
            <p>Puntaje: ${anime.score}</p>
            <p>${anime.synopsis.substring(0,100)}...</p>
            <button onclick="eliminarAnime(${index})">Eliminar</button>
        `;
        div.appendChild(card);
    });
}

async function eliminarAnime(index) {
    const anime = animes[index];
    await fetch(`${API_BACKEND}/animes/${anime.mal_id}`, {method:'DELETE'});
    animes.splice(index,1);
    renderList();
}

function filtrarLista() {
    const filtro = document.getElementById('searchInput').value;
    renderList(filtro);
}

// Escuchar cambios en otra pestaña
window.addEventListener('storage', cargarLista);

// Cargar lista inicialmente
cargarLista();
</script>

</body>
</html>
