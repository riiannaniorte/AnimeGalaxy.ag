<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Lista</title>
<link rel="stylesheet" href="styless.css">
<link rel="icon" href="https://drive.google.com/uc?export=view&id=1snA7nhE3vNeix-iXoUGH_sU7Yg531aAy">
</head>
<body>

<div class="content-wrapper">

  <div class="navbar">
    <div class="navbar-brand">
      <img src="https://drive.google.com/uc?export=view&id=1snA7nhE3vNeix-iXoUGH_sU7Yg531aAy" alt="AnimeGalaxy Logo" class="navbar-logo">
      <span>AnimeGalaxy</span>
    </div>
    <div class="navbar-menu">
      <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
      <a href="Directorio_anime.html"><i class="fas fa-film"></i> Directorio Anime</a>
      <a href="buscar_anime.html"><i class="fas fa-search"></i> Buscar</a>
      <a href="foro.html"><i class="fas fa-comments"></i> Foro</a>
      <a href="quienes_somos.html"><i class="fas fa-users"></i> Quiénes Somos</a>
      <a href="contacto.html"><i class="fas fa-envelope"></i> Contacto</a>
      <div class="dropdown">
        <a href="#"><i class="fas fa-user"></i> Perfil <i class="fas fa-caret-down"></i></a>
        <div class="dropdown-content">
          <a href="iniciar_sesion.html">Iniciar Sesión</a>
          <a href="mi_lista.html">Mi Lista</a>
        </div>
      </div>
    </div>
  </div>

  <div id="mi-lista" class="card-container" style="padding:20px;"></div>

</div>

<script>
// Cargar lista desde localStorage
let miLista = JSON.parse(localStorage.getItem('miLista')) || [];
const container = document.getElementById('mi-lista');

// --- Variables de Paginación ---
const ANIME_PER_PAGE = 10;
let currentPage = 1;
// ------------------------------

/**
 * Genera el HTML para los botones de paginación.
 * Nota: Los estilos están en línea para asegurar que se muestren correctamente, aunque lo ideal es que estén en styless.css.
 */
function renderPaginacionControls(totalItems, itemsPerPage, currentPage) {
    const totalPages = Math.ceil(totalItems / itemsPerPage);
    if (totalPages <= 1) return '';

    let controlsHTML = '<div class="pagination-controls" style="margin-top: 20px; text-align: center; color: white; width: 100%;">';

    // Botón Anterior
    controlsHTML += `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} style="padding: 10px; margin: 0 5px; cursor: pointer; background-color: #333; color: white; border: 1px solid #555; border-radius: 5px; transition: background-color 0.3s;">&laquo; Anterior</button>`;

    // Números de Página
    // Se limita el número de páginas mostradas para evitar desbordamiento.
    const maxPagesToShow = 5;
    let startPage = Math.max(1, currentPage - Math.floor(maxPagesToShow / 2));
    let endPage = Math.min(totalPages, startPage + maxPagesToShow - 1);
    
    if (endPage - startPage + 1 < maxPagesToShow) {
        startPage = Math.max(1, endPage - maxPagesToShow + 1);
    }
    
    for (let i = startPage; i <= endPage; i++) {
        const isActive = currentPage === i;
        controlsHTML += `<button onclick="changePage(${i})" ${isActive ? 'style="background-color: #f7931e; color: white; border-color: #f7931e;"' : 'style="background-color: #333; color: white; border-color: #555;"'} class="pagination-btn" style="padding: 10px 15px; margin: 0 5px; cursor: pointer; border-radius: 5px; transition: background-color 0.3s;">${i}</button>`;
    }

    // Botón Siguiente
    controlsHTML += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} style="padding: 10px; margin: 0 5px; cursor: pointer; background-color: #333; color: white; border: 1px solid #555; border-radius: 5px; transition: background-color 0.3s;">Siguiente &raquo;</button>`;

    controlsHTML += '</div>';
    return controlsHTML;
}

function renderMiLista() {
    container.innerHTML = '';

    if (miLista.length === 0) {
        container.innerHTML = '<p style="color:white; text-align: center; width: 100%;">No tienes animes guardados.</p>';
        return;
    }

    // Calcular el rango de animes a mostrar
    const startIndex = (currentPage - 1) * ANIME_PER_PAGE;
    const endIndex = startIndex + ANIME_PER_PAGE;
    const itemsToShow = miLista.slice(startIndex, endIndex);

    // Renderizar tarjetas
    itemsToShow.forEach(anime => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <img src="${anime.image}" alt="${anime.name}" class="clickable-img">
            <h2>${anime.name}</h2>
            <p>${anime.synopsis}</p>
            <button class="delete-btn">Eliminar</button>
        `;
        container.appendChild(card);

        // Click en imagen -> ir a anime_detalle.html?id=ID
        const img = card.querySelector('.clickable-img');
        img.style.cursor = 'pointer';
        img.addEventListener('click', () => {
            window.location.href = `anime_detalle.html?id=${anime.id}`;
        });

        // Botón eliminar
        const btnDelete = card.querySelector('.delete-btn');
        btnDelete.addEventListener('click', () => {
            // Eliminar de la lista y actualizar localStorage
            miLista = miLista.filter(a => a.id !== anime.id);
            localStorage.setItem('miLista', JSON.stringify(miLista));
            
            // Ajustar la página actual si es necesario (ej: si se vacía la última página)
            const totalPagesAfterDeletion = Math.ceil(miLista.length / ANIME_PER_PAGE);
            if (currentPage > totalPagesAfterDeletion && totalPagesAfterDeletion >= 1) {
                currentPage = totalPagesAfterDeletion;
            } else if (miLista.length === 0) {
                 currentPage = 1;
            }

            renderMiLista();
        });
    });

    // Añadir controles de paginación después de las tarjetas
    const paginationControlsHTML = renderPaginacionControls(miLista.length, ANIME_PER_PAGE, currentPage);
    if (paginationControlsHTML) {
        container.insertAdjacentHTML('beforeend', paginationControlsHTML);
    }
}

/**
 * Función global para cambiar la página.
 */
window.changePage = (newPage) => {
    const totalPages = Math.ceil(miLista.length / ANIME_PER_PAGE);

    if (newPage >= 1 && newPage <= totalPages) {
        currentPage = newPage;
        renderMiLista();
        // Mueve el foco al contenedor para ver los nuevos elementos
        container.scrollIntoView({ behavior: 'smooth', block: 'start' }); 
    }
};

// Inicializar render al cargar la página
renderMiLista();
</script>

</body>
</html>
