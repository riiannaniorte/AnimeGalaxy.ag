<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Lista de Animes</title>
<style>
  body { font-family: Arial, sans-serif; background:#222; color:white; }
  .card { display:inline-block; margin:10px; padding:10px; background:rgba(255,255,255,0.1); border-radius:10px; width:200px; text-align:center; }
  img { width:100%; border-radius:10px; }
  button { margin-top:5px; padding:5px 10px; cursor:pointer; border-radius:5px; border:none; background:#ff4444; color:white; }
</style>
</head>
<body>
<h1>Mi Lista de Animes</h1>
<div id="lista-animes"></div>

<script>
const API_BACKEND = 'http://172.20.160.96:3000';

async function cargarLista(){
  const animes = await fetch(`${API_BACKEND}/animes`).then(r=>r.json());
  const cont = document.getElementById('lista-animes');
  cont.innerHTML = '';
  animes.forEach(a=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${a.image}" alt="${a.name}">
      <h2>${a.name}</h2>
      <p>${a.synopsis}</p>
      <button data-id="${a.mal_id}">Eliminar</button>
    `;
    cont.appendChild(card);

    const btn = card.querySelector('button');
    btn.addEventListener('click', async ()=>{
      await fetch(`${API_BACKEND}/animes/${a.mal_id}`, { method:'DELETE' });
      cargarLista();
    });
  });
}

// Inicializar
cargarLista();
</script>
</body>
</html>
