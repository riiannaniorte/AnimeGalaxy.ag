<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Lista</title>
<link rel="stylesheet" href="styless.css">
</head>
<body>

<div class="content-wrapper">
<h1>Mi Lista de Anime</h1>
<div class="card-container" id="mi-lista"></div>
</div>

<script>
let miLista = JSON.parse(localStorage.getItem('miLista')) || [];

const container = document.getElementById('mi-lista');
if(miLista.length === 0){
  container.innerHTML = '<p>No tienes animes guardados.</p>';
} else {
  for(const anime of miLista){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${anime.image}" alt="${anime.name}">
      <h2>${anime.name}</h2>
      <p>${anime.synopsis}</p>
    `;
    container.appendChild(card);
  }
}
</script>

</body>
</html>
