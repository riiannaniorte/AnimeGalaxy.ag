<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Lista</title>
<link rel="stylesheet" href="styless.css">
<link rel="icon" href="https://drive.google.com/uc?export=view&id=1snA7nhE3vNeix-iXoUGH_sU7Yg531aAy">
</head>
<body>

<div class="content-wrapper">

  <!-- Navbar -->
  <div class="navbar">
    <div class="navbar-brand">
      <img src="https://drive.google.com/uc?export=view&id=1snA7nhE3vNeix-iXoUGH_sU7Yg531aAy" alt="AnimeGalaxy Logo" class="navbar-logo">
      <span>AnimeGalaxy</span>
    </div>
    <div class="navbar-menu">
      <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
      <a href="Directorio_anime.html"><i class="fas fa-film"></i> Directorio Anime</a>
      <a href="buscar_anime.html"><i class="fas fa-search"></i> Buscar</a>
      <a href="foro.html"><i class="fas fa-comments"></i> Foro</a>
      <a href="quienes_somos.html"><i class="fas fa-users"></i> Quiénes Somos</a>
      <a href="contacto.html"><i class="fas fa-envelope"></i> Contacto</a>
      <div class="dropdown">
        <a href="#"><i class="fas fa-user"></i> Perfil <i class="fas fa-caret-down"></i></a>
        <div class="dropdown-content">
          <a href="iniciar_sesion.html">Iniciar Sesión</a>
          <a href="mi_lista.html">Mi Lista</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenedor de tarjetas -->
  <div id="mi-lista" class="card-container" style="padding:20px;"></div>

</div>

<script>
// Cargar lista desde localStorage
let miLista = JSON.parse(localStorage.getItem('miLista')) || [];
const container = document.getElementById('mi-lista');

function renderMiLista() {
  container.innerHTML = '';
  if(miLista.length === 0){
    container.innerHTML = '<p style="color:white;">No tienes animes guardados.</p>';
    return;
  }

  miLista.forEach(anime => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${anime.image}" alt="${anime.name}" class="clickable-img">
      <h2>${anime.name}</h2>
      <p>${anime.synopsis}</p>
      <button class="delete-btn">Eliminar</button>
    `;
    container.appendChild(card);

    // Click en imagen -> ir a anime_detalle.html?id=ID
    const img = card.querySelector('.clickable-img');
    img.style.cursor = 'pointer';
    img.addEventListener('click', () => {
      window.location.href = `anime_detalle.html?id=${anime.id}`;
    });

    // Botón eliminar
    const btnDelete = card.querySelector('.delete-btn');
    btnDelete.addEventListener('click', () => {
      miLista = miLista.filter(a => a.id !== anime.id);
      localStorage.setItem('miLista', JSON.stringify(miLista));
      renderMiLista();
    });
  });
}

// Inicializar render
renderMiLista();
</script>

</body>
</html>
