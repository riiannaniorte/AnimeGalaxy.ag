<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Información - DaiAnime</title>
    <link rel="stylesheet" href="anime.css">
    <link rel="icon" type="image/png" href="DaiAnime.jpeg">
</head>
<body>

<header class="page-header">
    <a href="index.html">
        <img src="DaiAnime.jpeg" style="height:40px; vertical-align:middle;" alt="Logo">
        DaiAnime
    </a>
</header>

<div class="anime-container">
    <div class="anime-image">
        <img id="contenido-img" src="imagenes/anime/default.jpg" alt="Portada">
    </div>

    <div class="anime-info">
        <h1 id="contenido-titulo">Cargando...</h1>

        <p><strong>Sinopsis:</strong><br>
        <span id="contenido-sinopsis">Cargando sinopsis...</span></p>

        <p><strong>Categoría:</strong> <span id="contenido-categoria">--</span></p>
        <p><strong>Fecha de Estreno:</strong> <span id="contenido-fecha">--</span></p>

        <div class="rating-box" style="margin: 20px 0;">
            <h3 id="contenido-rating">⭐ Media: --</h3>
        </div>

        <!-- Botón para ver / reproducir el contenido -->
        <div id="contenedor-link" style="margin-bottom: 20px;">
            <!-- El enlace se inyectará aquí dinámicamente -->
        </div>

        <a href="index.html" class="back-btn">⬅ Volver al Inicio</a>
    </div>
</div>

<div class="comentarios-seccion" style="max-width: 1100px; margin: 0 auto; padding: 20px;">
    <div class="rating-box">
        <h3>Deja tu reseña</h3>
        <form onsubmit="event.preventDefault(); alert('Reseña enviada con éxito');">
            <select name="puntuacion" required>
                <option value="10">10</option>
                <option value="9">9</option>
                <option value="8">8</option>
                <option value="7">7</option>
                <option value="6">6</option>
                <option value="5">5</option>
                <option value="4">4</option>
                <option value="3">3</option>
                <option value="2">2</option>
                <option value="1">1</option>
            </select>
            <br><br>
            <textarea name="comentario" required style="width:100%; height:80px;" placeholder="¿Qué te ha parecido?"></textarea>
            <br><br>
            <button type="submit" class="back-btn" style="border:none;">Enviar</button>
        </form>
    </div>

    <h2 style="text-align:center; color: var(--highlight-color);">Comunidad</h2>

    <div class="rating-box">
        <strong>UsuarioEjemplo</strong> 
        <span style="color: #f1c40f;">⭐ 9/10</span>
        <p>¡Excelente contenido!</p>
        <small>2026-01-15 10:30:00</small>
    </div>
</div>

<script>
    const sheetDbUrl = 'https://sheetdb.io/api/v1/2fm1f2txx7vmc';

    window.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const tituloBuscado = urlParams.get('titulo');

        if (!tituloBuscado) {
            document.getElementById('contenido-titulo').textContent = "No se encontró el título.";
            return;
        }

        fetch(sheetDbUrl)
            .then(res => res.json())
            .then(datos => {
                const itemEncontrado = datos.find(i => i.titulo === tituloBuscado);

                if (itemEncontrado) {
                    document.getElementById('contenido-titulo').textContent = itemEncontrado.titulo;
                    document.getElementById('contenido-sinopsis').textContent = itemEncontrado.sinopsis || 'Sin sinopsis disponible.';
                    document.getElementById('contenido-categoria').textContent = itemEncontrado.categoria || 'N/D';
                    document.getElementById('contenido-fecha').textContent = itemEncontrado.fecha || 'N/D';
                    
                    if (itemEncontrado.rating) {
                        document.getElementById('contenido-rating').textContent = `⭐ Media: ${itemEncontrado.rating}`;
                    }

                    if (itemEncontrado.imagen) {
                        document.getElementById('contenido-img').src = itemEncontrado.imagen;
                    }

                    const contenedorLink = document.getElementById('contenedor-link');
                    if (itemEncontrado.link) {
                        contenedorLink.innerHTML = `
                            <a href="${itemEncontrado.link}" target="_blank" class="back-btn" style="background-color: #27ae60; color: white; text-decoration: none; display: inline-block; padding: 10px 20px; font-weight: bold; border-radius: 5px;">
                                ▶ Ver / Reproducir Ahora
                            </a>
                        `;
                    } else {
                        contenedorLink.innerHTML = '<p style="color: #e74c3c;">Enlace de reproducción no disponible.</p>';
                    }

                } else {
                    document.getElementById('contenido-titulo').textContent = "No se encontró este contenido en la base de datos.";
                }
            })
            .catch(err => {
                console.error('Error al cargar datos:', err);
                document.getElementById('contenido-titulo').textContent = "Error al cargar los datos.";
            });
    });
</script>
</body>
</html>
